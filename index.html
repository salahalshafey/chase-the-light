<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chase the Light · طارِد الضوء</title>
<meta name="description" content="A 3D game that teaches special relativity to kids and adults: six missions and a free lab, in Arabic and English.">
<meta property="og:title" content="Chase the Light · طارِد الضوء">
<meta property="og:description" content="Slow time, squeeze space and catch up with light. Almost. A 3D special-relativity game in Arabic and English.">
<meta property="og:type" content="website">
<meta property="og:image" content="docs/menu.jpg">
<meta name="theme-color" content="#04060f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2304060f'/%3E%3Ccircle cx='32' cy='32' r='13' fill='%23ffd84a'/%3E%3Ccircle cx='32' cy='32' r='22' fill='none' stroke='%23ffd84a' stroke-opacity='.35' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Readex+Pro:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app" data-screen="menu">
  <canvas id="stage" aria-hidden="true"></canvas>
  <div id="labels" aria-hidden="true"></div>
  <div id="fade" aria-hidden="true"></div>

  <header id="topbar">
    <button id="btn-back" class="ghost" type="button"></button>
    <div id="top-title"></div>
    <div class="spacer"></div>
    <div id="top-stars" title=""></div>
    <button id="btn-sound" class="ghost icon" type="button"></button>
    <button id="btn-lang" class="ghost" type="button"></button>
  </header>

  <main id="menu">
    <section class="hero">
      <p class="eyebrow" id="hero-eyebrow"></p>
      <h1 id="hero-title"></h1>
      <p class="tagline" id="hero-tagline"></p>
      <div class="cruise" id="cruise">
        <span id="cruise-label"></span>
        <div class="cruise-bar"><i id="cruise-fill"></i><b>c</b></div>
        <span class="digits" id="cruise-val"></span>
      </div>
    </section>
    <section>
      <h2 id="menu-pick"></h2>
      <div id="cards"></div>
    </section>
  </main>

  <aside id="console" aria-live="polite">
    <div class="console-head">
      <span class="chip" id="c-step"></span>
      <span class="chip tag" id="c-tag"></span>
    </div>
    <div class="guide">
      <div class="foton" aria-hidden="true"><i></i><i></i></div>
      <p id="c-task"></p>
    </div>
    <div id="c-extra"></div>
    <div id="c-custom"></div>
    <div id="c-speed">
      <div class="speed-read">
        <span class="digits big" id="sp-pct"></span>
        <span class="speed-sub"><span id="sp-of"></span><br><span class="digits" id="sp-kms"></span></span>
      </div>
      <div class="speed-row">
        <button type="button" class="nudge" id="sp-minus" aria-label="slower">&minus;</button>
        <div class="track"><input type="range" id="sp-range" min="0" max="999" step="1" value="0"><b class="wall">c</b></div>
        <button type="button" class="nudge" id="sp-plus" aria-label="faster">+</button>
      </div>
      <p class="limit" id="sp-limit"></p>
    </div>
    <div id="c-quiz"></div>
    <button id="c-go" class="primary" type="button"></button>
    <div id="c-feedback" hidden></div>
    <dl id="c-readouts"></dl>
  </aside>

  <div id="modal" hidden>
    <div class="sheet" role="dialog" aria-modal="true">
      <p class="eyebrow" id="m-eyebrow"></p>
      <h2 id="m-title"></h2>
      <div class="m-stars" id="m-stars"></div>
      <p id="m-kid"></p>
      <div class="curious">
        <h3 id="m-curious-h"></h3>
        <p id="m-curious"></p>
        <code id="m-formula" dir="ltr"></code>
      </div>
      <div class="m-actions">
        <button class="ghost" id="m-menu" type="button"></button>
        <button class="ghost" id="m-again" type="button"></button>
        <button class="primary" id="m-next" type="button"></button>
      </div>
    </div>
  </div>

  <div id="veil" aria-live="polite">
    <div class="veil-box">
      <div class="orbit" aria-hidden="true"><i></i><u></u><b></b></div>
      <p class="eyebrow" id="veil-tag"></p>
      <h2 id="veil-title"></h2>
      <p class="fact" id="veil-fact"></p>
      <p class="status" id="veil-status"></p>
    </div>
  </div>

  <div id="intro">
    <button id="intro-lang" class="ghost" type="button"></button>
    <div class="intro-box">
      <div class="orbit big" aria-hidden="true"><i></i><u></u><b></b></div>
      <p class="eyebrow" id="intro-eyebrow"></p>
      <h1 id="intro-title"></h1>
      <div class="load" id="intro-load">
        <div class="bar"><i id="intro-bar"></i></div>
        <p class="status" id="intro-status"></p>
      </div>
      <button id="intro-go" class="primary" type="button" hidden></button>
      <p class="note" id="intro-note"></p>
    </div>
  </div>
  <div id="nogl" hidden></div>
</div>
<!-- Three.js r128 and its bloom add-ons (vendored, MIT) -->
<script src="vendor/three/three.min.js"></script>
<script src="vendor/three/shaders/CopyShader.js"></script>
<script src="vendor/three/shaders/LuminosityHighPassShader.js"></script>
<script src="vendor/three/postprocessing/EffectComposer.js"></script>
<script src="vendor/three/postprocessing/RenderPass.js"></script>
<script src="vendor/three/postprocessing/ShaderPass.js"></script>
<script src="vendor/three/postprocessing/UnrealBloomPass.js"></script>
<!-- The game. Order matters: each file uses the ones above it, and app.js starts everything. -->
<script src="js/strings.js"></script>
<script src="js/core.js"></script>
<script src="js/kit.js"></script>
<script src="js/audio.js"></script>
<script src="js/missions/light-clock.js"></script>
<script src="js/missions/twin-trip.js"></script>
<script src="js/missions/garage.js"></script>
<script src="js/missions/cockpit.js"></script>
<script src="js/missions/train.js"></script>
<script src="js/lab/vehicles.js"></script>
<script src="js/lab/destinations.js"></script>
<script src="js/lab/interiors.js"></script>
<script src="js/lab/journey.js"></script>
<script src="js/lab/lab.js"></script>
<script src="js/app.js"></script>
</body>
</html>
